name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Required by the "Protect main" ruleset. Runs the same command as a laptop.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      # The scans run in the `scan` job, which has the tools; SKIP_SCANS stops `verify` running them here too.
      - run: npm run verify
        env:
          SKIP_SCANS: '1'
      # Sites install dist/ straight from git, so it must match src/.
      - name: dist/ is up to date
        if: always()
        run: git diff --exit-code -- dist || (echo "Run npm run build and commit dist/." && exit 1)

  # Secrets and known-vulnerable dependencies (standards/security.md, "scans on every
  # PR"). Required check. The tools are release binaries with pinned SHA-256s
  # (scripts/ci-install-scan-tools.sh); `gitleaks-action` needs a paid licence.
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Full history: gitleaks reads the commits between origin/main and this branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: bash scripts/ci-install-scan-tools.sh gitleaks osv-scanner
      # A push to main has already passed on its pull request, and has no commits
      # beyond origin/main to scan.
      - if: github.event_name == 'pull_request'
        run: npm run scan:secrets
      - run: npm run scan:deps
