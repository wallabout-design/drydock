# Vulnerabilities that `npm run scan:deps` should not fail on. Each entry needs
# a `reason` and an `effectiveUntil` date (when the ignore stops applying), so
# an ignore cannot outlive the reason for it. Use the vulnerability's ID, e.g.
#
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"
# effectiveUntil = 2026-12-31
# reason = "No fix is released yet; the code path is not reachable (see issue #N)"

[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
effectiveUntil = 2026-12-18
reason = "picomatch 4.0.7 is the newest release in its line, so there is no fix to take yet. It is a glob matcher used only by the build and test tooling (vite, vitest) on our own file paths; it is not in the published package, whose only dependency is jose. Re-check for a release on the end date."
